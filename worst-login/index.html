<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose a difficulty for the Ordinary login prototype.">
  <title>Choose difficulty · Ordinary</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="header"><a class="brand" href="./" aria-label="Ordinary home"><span class="brand-mark" aria-hidden="true">o.</span>ordinary</a><span class="badge">DESIGN LAB / 01</span></header>
  <main>
    <section class="login-card" aria-labelledby="heading">
      <div class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M5 20v-5M12 20V9M19 20V3" stroke-linecap="round"/></svg></div>
      <p class="eyebrow">BEFORE WE BEGIN</p>
      <h1 id="heading">Pick your difficulty.</h1>
      <p class="intro">How hard could signing in possibly be?</p>
      <nav class="difficulty-options" aria-label="Select difficulty">
        <a class="difficulty-option" href="login.html?difficulty=easy"><span class="difficulty-number" aria-hidden="true">01</span><span>Easy</span><span class="difficulty-arrow" aria-hidden="true">→</span></a>
        <a class="difficulty-option" href="login.html?difficulty=medium"><span class="difficulty-number" aria-hidden="true">02</span><span>Medium</span><span class="difficulty-arrow" aria-hidden="true">→</span></a>
        <a class="difficulty-option" href="login.html?difficulty=hard"><span class="difficulty-number" aria-hidden="true">03</span><span>Hard</span><span class="difficulty-arrow" aria-hidden="true">→</span></a>
      </nav>
      <aside class="demo-note"><span class="demo-dot" aria-hidden="true"></span><div><strong>Same login. For now.</strong><p>All three difficulties currently lead to the base demo.</p></div></aside>
    </section>
  </main>
  <footer><span>Ordinary © 2026</span><span>An intentionally ordinary starting point.</span><span>CLASSROOM PROTOTYPE</span></footer>
</body>
</html>
