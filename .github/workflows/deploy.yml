name: Deploy Website to cPanel

on:
  push:
    branches:
      - main  # Triggers the deployment on every push to the main branch

jobs:
  web-deploy:
    name: Production Deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4
    
    - name: 🚀 Sync files via FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        # If your cPanel FTP account points directly to public_html, leave this as ./
        # Otherwise, specify the subfolder here (e.g., server-dir: public_html/)
        server-dir: ./ 
